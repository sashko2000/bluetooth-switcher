# Builds the app and publishes a GitHub release when a version tag is pushed:
#   git tag v1.0.0
#   git push origin v1.0.0
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the release and upload the archive

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }} # passed via env, not inlined into scripts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # A plain folder, not a single self-extracting exe: single-file bundles of unsigned apps are a common
      # false positive of antivirus machine-learning models (the bundle hides the managed code from static analysis).
      - name: Publish (self-contained folder)
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          dotnet publish src/MagicSwitcher -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=false -p:DebugType=none -p:Version=$version -o publish/MagicSwitcher
          Compress-Archive -Path publish/MagicSwitcher -DestinationPath "MagicSwitcher-$version-win-x64.zip"

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:TAG.TrimStart('v')
          gh release create $env:TAG "MagicSwitcher-$version-win-x64.zip" `
            --title "MagicSwitcher $version" --generate-notes
